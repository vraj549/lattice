[project]
name = "lattice-fea"
version = "0.12.0"
description = "Browser-based FEA workbench: STEP import, gmsh meshing, code_aster solves (static / modal / harmonic)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lattice contributors" }]
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "numpy>=1.24",
    "h5py>=3.8",
    "gmsh>=4.11",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
lattice = "lattice_fea.__main__:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lattice_fea*"]

[tool.setuptools.package-data]
lattice_fea = ["ui/**/*"]
